apiVersion: v1
kind: Namespace
metadata:
  name: runguard
---
apiVersion: v1
kind: Secret
metadata:
  name: runguard-operator-token
  namespace: runguard
type: Opaque
stringData:
  # Agent token from your RunGuard account page. Fill this in before
  # applying — never commit a real value here.
  agent-token: "REPLACE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runguard-operator
  namespace: runguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runguard-operator
  template:
    metadata:
      labels:
        app: runguard-operator
    spec:
      serviceAccountName: runguard-operator
      containers:
        - name: operator
          image: ghcr.io/smega/runguard-operator:latest
          args:
            # - --namespace=my-namespace   # omit to watch all namespaces
            # - --cluster-name=home-k3s    # set if one RunGuard account spans multiple clusters
            - --poll-interval=30s
          env:
            - name: RUNGUARD_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: runguard-operator-token
                  key: agent-token
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
