apiVersion: v1
kind: Namespace
metadata:
  name: runguard
---
apiVersion: v1
kind: Secret
metadata:
  name: runguard-operator-token
  namespace: runguard
type: Opaque
stringData:
  # Agent token from your RunGuard account page. Fill this in before
  # applying — never commit a real value here.
  agent-token: "REPLACE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runguard-operator
  namespace: runguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runguard-operator
  template:
    metadata:
      labels:
        app: runguard-operator
    spec:
      serviceAccountName: runguard-operator
      # If your image registry is private (even to yourself — e.g. a GHCR
      # package that inherits a private repo's visibility), uncomment this
      # and create the secret first:
      #   kubectl create secret docker-registry ghcr-pull-secret -n runguard \
      #     --docker-server=... --docker-username=... --docker-password=...
      # imagePullSecrets:
      #   - name: ghcr-pull-secret
      containers:
        - name: operator
          # Built by .github/workflows/operator-image.yml in this repo —
          # point it at wherever you publish that image for your own fork.
          image: your-registry/runguard-operator:latest
          args:
            - --api=https://your-runguard-instance.example  # required
            # - --namespace=my-namespace   # omit to watch all namespaces
            # - --cluster-name=home-k3s    # set if one RunGuard account spans multiple clusters
            - --poll-interval=30s
          env:
            - name: RUNGUARD_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: runguard-operator-token
                  key: agent-token
            # Required for auto-wrapping (see README "Limitations"):
            # - name: RUNGUARD_INSTALL_URL
            #   value: "https://your-runguard-instance.example/install.sh"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
