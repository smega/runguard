# Copy this file to config.yml and fill in real values.
# config.yml is gitignored because it holds live secrets — never commit it.

server:
  addr: ":8888"
  frontend_origin: "https://your-frontend-domain.example"
  # If a reverse proxy (nginx, a CDN, etc) sits in front of this backend,
  # list its address(es) here so X-Forwarded-For is trusted only from
  # there — otherwise leave empty (safe default: trusts nothing).
  trusted_proxies:
    - "127.0.0.1"

public_base_url: "https://your-domain.example"

mongo:
  uri: "mongodb+srv://<user>:<password>@<cluster-host>/runguard?retryWrites=true&w=majority"
  database: "runguard"

auth:
  # Generate a long random string, e.g.: openssl rand -hex 48
  jwt_secret: "REPLACE_WITH_RANDOM_SECRET"
  cookie_name: "cw_auth"
  # Set true whenever the app is served over https (which it should be in
  # any real deployment). Only use false for local development over http.
  cookie_secure: true
  cookie_domain: ""

admin:
  # Anyone listed here is auto-promoted to admin on every backend startup.
  bootstrap_emails:
    - "you@example.com"

app:
  base_url: "https://your-domain.example"

mailgun:
  enabled: true
  domain: "mg.your-domain.example"
  base_url: "https://api.eu.mailgun.net/v3"
  api_key: "REPLACE_WITH_MAILGUN_API_KEY"
  from: "RunGuard <info@your-domain.example>"

alerts:
  enabled: true
  check_interval_seconds: 30
  min_late_seconds: 0
  cooldown_seconds: 1800

# RunGuard isn't monetized -- there's no plan/tier system, just an optional
# per-user cap. 0 (or omit the key) means unlimited, which is what you want
# for a self-hosted instance. The author's own hosted instance sets these
# low (e.g. 3) purely to keep it small, not as a paid-tier upsell.
limits:
  max_jobs_per_user: 0
  max_projects_per_user: 0
