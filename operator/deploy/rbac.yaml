apiVersion: v1
kind: ServiceAccount
metadata:
  name: runguard-operator
  namespace: runguard
---
# Cluster-wide: needed to watch CronJobs in every namespace by default
# (pass --namespace to the Deployment to scope this down to one namespace
# instead, and swap this for a namespaced Role/RoleBinding).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runguard-operator
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runguard-operator
subjects:
  - kind: ServiceAccount
    name: runguard-operator
    namespace: runguard
roleRef:
  kind: ClusterRole
  name: runguard-operator
  apiGroup: rbac.authorization.k8s.io
